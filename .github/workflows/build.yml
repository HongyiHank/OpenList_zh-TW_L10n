name: Build and Release
on:
  push:
    branches: [main]
    paths:
      - 'zh-TW/**'
      - 'version.txt'
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      safe_to_build: ${{ steps.check.outputs.safe_to_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          # workflow_dispatch 手動觸發時，直接放行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "safe_to_build=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch — skip zh-CN check"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^zh-CN/'; then
            echo "safe_to_build=false" >> $GITHUB_OUTPUT
            echo "::warning::zh-CN/ has changes in this push — upstream language files updated, skipping build to wait for translation"
          else
            echo "safe_to_build=true" >> $GITHUB_OUTPUT
            echo "zh-CN/ unchanged — safe to build"
          fi
  frontend:
    needs: preflight
    if: needs.preflight.outputs.safe_to_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.tags.outputs.backend_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
      frontend_ver: ${{ steps.tags.outputs.frontend_ver }}
    steps:
      # 解析上游最新 tag
      - id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BE_TAG=$(gh api repos/OpenListTeam/OpenList/releases/latest --jq .tag_name)
          FE_TAG=$(gh api repos/OpenListTeam/OpenList-Frontend/releases/latest --jq .tag_name)
          echo "backend_tag=${BE_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${FE_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_ver=${FE_TAG#v}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: OpenListTeam/OpenList-Frontend
          ref: ${{ steps.tags.outputs.frontend_tag }}
      - uses: actions/checkout@v7
        with:
          path: lang-src
          sparse-checkout: |
            zh-TW
            zh-CN
      - run: corepack enable pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # 安裝依賴 & 覆蓋翻譯
      - name: Install & patch i18n
        run: |
          pnpm install --frozen-lockfile
          FE_TAG="${{ steps.tags.outputs.frontend_tag }}"
          curl -fsSL --retry 3 -o i18n.tar.gz \
            "https://github.com/OpenListTeam/OpenList-Frontend/releases/download/${FE_TAG}/i18n.tar.gz" \
            && tar -xzf i18n.tar.gz -C src/lang \
            || echo "::warning::i18n.tar.gz not found, using local translations only"
          mkdir -p src/lang/zh-TW src/lang/zh-CN
          cp lang-src/zh-TW/*.json src/lang/zh-TW/
          echo '{"lang":"繁體中文"}' > src/lang/zh-TW/index.json
          cp lang-src/zh-CN/*.json src/lang/zh-CN/ 2>/dev/null \
            || cp src/lang/en/*.json src/lang/zh-CN/
          echo '{"lang":"简体中文"}' > src/lang/zh-CN/index.json
      - name: Build
        run: |
          node scripts/i18n.mjs
          pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1
  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64-musl, windows-amd64]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: OpenListTeam/OpenList
          ref: ${{ needs.frontend.outputs.backend_tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - id: goinfo
        run: echo "go_version=$(go version | sed 's/go version //')" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: public/dist
      - uses: OpenListTeam/cgo-actions@v1.2.5
        with:
          targets: ${{ matrix.target }}
          flags: ${{ contains(matrix.target, '-musl') && '-ldflags=-linkmode external -extldflags ''-static -fpic''' || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          musl-base-url: "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GoVersion=${{ steps.goinfo.outputs.go_version }}
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=GitHub Actions
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${{ needs.frontend.outputs.backend_tag }}
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=${{ needs.frontend.outputs.frontend_ver }}
          output: openlist-$target$ext
      - name: Verify musl binary is static
        if: contains(matrix.target, '-musl')
        run: |
          set -e
          for f in build/openlist-*-musl-*; do
            if readelf -l "$f" | grep -q "Requesting program interpreter"; then
              echo "::error::Dynamic binary detected: $f"
              readelf -l "$f" | grep "Requesting program interpreter" || true
              exit 1
            fi
          done
          echo "Static binary verification passed"
      - uses: actions/upload-artifact@v7
        with:
          name: openlist-${{ matrix.target }}
          path: build/*
          retention-days: 1
  release:
    needs: [frontend, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: openlist-*
          merge-multiple: true
      - name: Compress & checksum
        working-directory: release-assets
        run: |
          for f in *; do
            case "$f" in
              *.exe)
                cp "$f" openlist.exe
                zip "${f%.exe}.zip" openlist.exe
                rm "$f" openlist.exe
                ;;
              *)
                cp "$f" openlist
                tar -czf "${f}.tar.gz" openlist
                rm "$f" openlist
                ;;
            esac
          done
          sha256sum * > sha256sums.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.frontend.outputs.backend_tag }}
          name: OpenList ${{ needs.frontend.outputs.backend_tag }}
          body: |
            包含
            - Linux (amd64)
            - Windows (amd64)
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
